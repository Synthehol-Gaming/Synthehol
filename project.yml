name: Synthehol
options:
  bundleIdPrefix: com.colinobrien
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  SyntheholKit:
    path: SyntheholKit

targets:
  Synthehol:
    type: application
    platform: macOS
    sources:
      - Synthehol
    dependencies:
      - package: SyntheholKit
    settings:
      base:
        ARCHS: arm64
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.colinobrien.Synthehol
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Synthehol/Synthehol.entitlements
    info:
      path: Synthehol/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.games
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: A Windows application is trying to access the microphone.
        NSCameraUsageDescription: A Windows application is trying to access the camera.
        CFBundleURLTypes:
          - CFBundleURLName: com.colinobrien.Synthehol.launch
            CFBundleURLSchemes: [synthehol]
