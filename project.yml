name: Synthehol
options:
  bundleIdPrefix: com.colinobrien
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  SyntheholKit:
    path: SyntheholKit

targets:
  Synthehol:
    type: application
    platform: macOS
    sources:
      - Synthehol
    dependencies:
      - package: SyntheholKit
    settings:
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.colinobrien.Synthehol
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 2
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Synthehol/Synthehol.entitlements
    info:
      path: Synthehol/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.games
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: A Windows application is trying to access the microphone.
        NSCameraUsageDescription: A Windows application is trying to access the camera.
        # Steam and games talk to LAN peers (Remote Play, discovery). Without
        # this key macOS can silently deny local networking for Wine children
        # (Whisky #787: "Steam has no internet connection").
        NSLocalNetworkUsageDescription: Windows games and Steam use the local network for discovery and Remote Play.
        CFBundleURLTypes:
          - CFBundleURLName: com.colinobrien.Synthehol.launch
            CFBundleURLSchemes: [synthehol]
        # Launcher .apps open synthehol:// URLs; without this, a URL arriving
        # during app startup can race LaunchServices into a second instance.
        LSMultipleInstancesProhibited: true
